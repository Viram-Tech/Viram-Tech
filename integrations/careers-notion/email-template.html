<!-- EmailJS "New application" template. Paste into the template's Content
     (Edit Content → Code editor). Variables are filled by lib/careers-notify.ts;
     keep the double braces so applicant text stays HTML-escaped. Dark text on
     white with no gradients or white text, so it stays readable when an email
     client strips styles. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="background-color:#ffffff;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;font-family:Arial,Helvetica,sans-serif;color:#14284E;">

        <!-- Header -->
        <tr>
          <td style="padding:0 0 20px;border-bottom:2px solid #33A5DB;">
            <p style="margin:0;font-size:13px;color:#597CBD;">ViramTech Careers</p>
            <p style="margin:6px 0 0;font-size:22px;line-height:1.3;font-weight:bold;color:#14284E;">New application: {{role}}</p>
          </td>
        </tr>

        <!-- Details -->
        <tr>
          <td style="padding:24px 0 0;">
            <p style="margin:0;font-size:13px;color:#6b7a99;">Name</p>
            <p style="margin:4px 0 0;font-size:16px;line-height:1.4;font-weight:bold;color:#14284E;">{{name}}</p>
          </td>
        </tr>
        <tr>
          <td style="padding:18px 0 0;">
            <p style="margin:0;font-size:13px;color:#6b7a99;">Email</p>
            <p style="margin:4px 0 0;font-size:16px;line-height:1.4;"><a href="mailto:{{email}}" style="color:#3F56A4;">{{email}}</a></p>
          </td>
        </tr>
        <tr>
          <td style="padding:18px 0 0;">
            <p style="margin:0;font-size:13px;color:#6b7a99;">LinkedIn / portfolio</p>
            <p style="margin:4px 0 0;font-size:16px;line-height:1.4;word-break:break-all;"><a href="{{linkedin}}" style="color:#3F56A4;">{{linkedin}}</a></p>
          </td>
        </tr>
        <tr>
          <td style="padding:18px 0 0;">
            <p style="margin:0;font-size:13px;color:#6b7a99;">Why ViramTech?</p>
            <p style="margin:4px 0 0;font-size:16px;line-height:1.6;color:#14284E;white-space:pre-wrap;">{{note}}</p>
          </td>
        </tr>

        <!-- Action -->
        <tr>
          <td style="padding:28px 0 0;">
            <a href="{{notion_url}}" style="display:inline-block;padding:12px 22px;border:2px solid #3F56A4;border-radius:8px;font-size:15px;font-weight:bold;color:#3F56A4;text-decoration:none;">Open résumé in Notion &rarr;</a>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="padding:32px 0 0;">
            <p style="margin:0;padding-top:16px;border-top:1px solid #e3e8f1;font-size:12px;line-height:1.5;color:#8090ad;">Sent by the careers form on viramtech.com. Contains applicant personal data; keep it within the hiring team.</p>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
